<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite: Multijugador (2 Jugadores)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222;
            margin: 0;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        #netStatus {
            margin-bottom: 10px;
            padding: 6px 14px;
            border-radius: 6px;
            background: #333;
            font-weight: bold;
            color: #4ade80;
        }
        canvas {
            max-width: 100%;
            background-color: #000;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        p {
            margin: 12px 16px 0;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
        kbd {
            background: #444;
            border-radius: 4px;
            padding: 1px 6px;
            color: #fff;
        }
    </style>
</head>
<body>
    <h2>Demo de sprite: 2 Jugadores</h2>
    <div id="netStatus">Conectando a la sala...</div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <p>
        <kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd>: caminar &nbsp;|&nbsp;
        <kbd>Shift</kbd> + mover: correr &nbsp;|&nbsp;
        <kbd>Espacio</kbd> / <kbd>↑</kbd> / <kbd>W</kbd>: brincar &nbsp;|&nbsp;
        <kbd>H</kbd>: ver hitboxes
    </p>
    <p>Abre esta misma URL en otro navegador para que entre el Jugador 2.</p>

    <!-- Librería PeerJS para conexión directa P2P en GitHub Pages -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="sprite.js"></script>
</body>
</html>
